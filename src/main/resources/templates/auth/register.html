<!DOCTYPE html>
<html layout:decorate="layout/layout">
<head>
    <title layout:fragment="title">ユーザー登録</title>
</head>
<main layout:fragment="content">
    <h1 class="text-center">ユーザー登録</h1>
    <form th:action="@{/auth/register}" method="post" class="mx-auto" style="max-width: 400px;">
        <div class="form-group mt-3">
            <label for="username">ユーザー名</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="form-group mt-3">
            <label for="password">パスワード</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-success w-100 mt-3">登録</button>
    </form>
</main>
</html>
