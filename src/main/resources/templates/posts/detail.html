<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout/layout">
    <head>
        <title layout:fragment="title">投稿詳細</title>
    </head>
    <main layout:fragment="content">
        <h1 th:text="${post.title}"></h1>
        <p th:text="${post.content}"></p>
        <a th:href="@{/posts}" class="btn btn-secondary">戻る</a>
        <span th:if="${post.user != null and loggedInUserId == post.user.id}">
            <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-primary">編集</a>
            <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display: inline;">
                <button type="submit" class="btn btn-danger">削除</button>
            </form>
        </span>
        <!-- いいねボタン -->
        <button id="like-button" th:class="${isLiked ? 'btn btn-danger': 'btn btn-outline-danger'}" th:data-post-id="${post.id}">
            <i id="like-icon" th:class="${isLiked ? 'bi bi-heart-fill': 'bi bi-heart'}"></i>
        </button>

        <!-- いいいねの数 -->
        <span id="like-count" th:text="${likeCount}"></span> 件のいいね

        <h2 class="mt-3">コメント</h2>
        <!-- コメント一覧 -->
         <div class="mb-3">
            <div th:each="comment : ${comments}">
                <div class="card mb-3">
                    <!-- コメントのヘッダー(ユーザー名と投稿日時) -->
                     <div class="card-header">
                        <strong th:text="${comment.user.username}">ユーザー名</strong>
                        <small class="text-muted ml-2" th:text="${#temporals.format(comment.createdAt, 'yyyy/MM/dd HH:mm:ss')}">日時</small>
                     </div>
                    <!-- コメントのボディ(コメント内容) -->
                     <div class="card-body">
                        <p th:text="${comment.content}">コメント内容</p>
                     </div>
                    <!-- コメントのフッター(削除ボタン) -->
                     <div class="card-footer">
                        <span th:if="${comment.user != null and loggedInUserId == comment.user.id}">
                            <form th:action="@{/comments/{id}/delete(id=${comment.id})}" method="post" style="display: inline;">
                                <input type="hidden" name="postId" th:value="${post.id}">
                                <button type="submit" class="btn btn-danger btn-sm">削除</button>
                            </form>                   
                        </span>
                     </div>
                </div>
            </div>
         </div>
        <!-- コメント追加フォーム -->
        <h3>コメント追加</h3>
        <form th:action="@{/comments/add}" method="post" th:object="${commentForm}">
            <input type="hidden" name="postId" th:value="${post.id}">
            <div class="mb-3">
                <textarea id="content" name="content" class="form-control" rows="3" placeholder="コメント…" required th:field="*{content}"></textarea>
                <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="text-danger"></div>
            </div>
            <button type="submit" class="btn btn-success">コメント追加</button>
        </form>

        <script>
            document.addEventListener("DOMContentLoaded", function(){
                // 要素を取得
                const likeButton = document.getElementById("like-button");
                const likeIcon = document.getElementById("like-icon");
                const likeCount = document.getElementById("like-count");

                // CSRFトークンの取得
                const csrfToken = document.querySelector("meta[name='_csrf']").getAttribute("content");
                const csrfHeader = document.querySelector("meta[name='_csrf_header']").getAttribute("content");

                // いいねボタンがクリックされた場合
                likeButton.addEventListener("click", function(){
                    // post-idを取得
                    const postId = likeButton.getAttribute("data-post-id");

                    fetch(`/posts/${postId}/like`, {
                        method: "POST",
                        headers: {
                            "content-type": "application/json",
                            [csrfHeader]: csrfToken
                        },
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            alert(data.error);
                            return;
                        }

                        // いいね状態の更新
                        if (data.isLiked) {
                            // いいねボタンを押下していない状態から押下した状態にする
                            likeButton.classList.remove("btn-outline-danger");
                            likeIcon.classList.remove("bi-heart");
                            likeButton.classList.add("btn-danger");
                            likeIcon.classList.add("bi-heart-fill");
                        } else {
                            // いいねボタンを押下した状態から押下していない状態にする
                            likeButton.classList.remove("btn-danger");
                            likeIcon.classList.remove("bi-heart-fill");
                            likeButton.classList.add("btn-outline-danger");
                            likeIcon.classList.add("bi-heart");
                        }

                        // いいね数の更新
                        likeCount.textContent = data.likeCount;
                    })
                    .catch(error => console.error("ERROR:", error));
                });
            });
        </script>
    </main> 
</html>
